[workspace]
resolver = "2"
members = [
    "crates/app-core",
    "crates/app-io",
    "crates/app-mcp",
    "crates/app-cli",
    "crates/app-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"

[workspace.dependencies]
# Core Serialization & Schema (Auto-generates MCP tool definitions)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
thiserror = "2.0"

# Data Structures (Avoids Rc<RefCell<T>> in state graphs)
slotmap = { version = "1.0", features = ["serde"] }
indexmap = { version = "2.6", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde", "js"] }

# CLI & Headless
clap = { version = "4.5", features = ["derive"] }

# Cross-Platform GUI (Native + Wasm)
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.31"
egui_dock = "0.16"
