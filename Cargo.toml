[workspace]
resolver = "3"
members = [
    "crates/app-core",
    "crates/app-io",
    "crates/app-sync",
    "crates/app-mcp",
    "crates/app-cli",
    "crates/app-gui",
    "crates/app-testkit",
    "xtask",
]
default-members = [
    "crates/app-core",
    "crates/app-io",
    "crates/app-sync",
    "crates/app-mcp",
    "crates/app-cli",
    "crates/app-gui",
    "crates/app-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92" # eframe 0.37 MSRV
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/dail"

# Every member crate MUST contain `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
# Panics are banned in library code; tests are exempted via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
# Libraries log through `tracing`; binaries write output via `std::io::Write`.
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
# --- Internal crates ---
app-core = { path = "crates/app-core" }
app-io = { path = "crates/app-io" }
app-sync = { path = "crates/app-sync" }
app-mcp = { path = "crates/app-mcp" }
app-gui = { path = "crates/app-gui" }
app-testkit = { path = "crates/app-testkit" }

# --- Core: pure data crates only (allowed in app-core) ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2" # JSON Schema -> MCP tool definitions (rmcp requires 1.x)
thiserror = "2.0"
indexmap = { version = "2.14", features = ["serde"] }
slotmap = { version = "1.1", features = ["serde"] }
# No RNG features here: app-core builds IDs from Ctx-provided values.
# Runtime crates opt into `v4` locally: `uuid = { workspace = true, features = ["v4"] }`.
uuid = { version = "1.28", features = ["serde"] }

# --- Mail formats & storage (app-io) ---
mail-parser = "0.11"
mail-builder = "1.0"
html2text = "0.17"
toml = "1.1"
redb = "4.4"
sha2 = "0.11"
directories = "6.0"

# --- Network runtime (app-sync) — rustls with `ring`, never aws-lc/openssl ---
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "signal"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "pool", "tokio1-rustls-tls"] }
keyring = "4.2" # default `v1` store set: Secret Service via zbus (pure Rust), Windows Credential Manager
interprocess = { version = "2.4", features = ["tokio"] }

# --- Agent surfaces ---
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
clap = { version = "4.6", features = ["derive"] }

# --- GUI (desktop-native; wasm deferred) ---
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit", "wayland", "x11"] }
egui = "0.37"
nucleo-matcher = "0.3"
rfd = "0.17" # native file dialogs; default = XDG portal (no GTK)

# --- Diagnostics ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0" # binaries (app-cli, xtask) only; libraries use thiserror

# --- Testing ---
insta = { version = "1.49", features = ["json"] }
proptest = "1.12"

[profile.dev.package."*"]
opt-level = 2 # keeps egui and mail parsing responsive in debug builds

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
