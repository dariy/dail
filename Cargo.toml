[workspace]
resolver = "3"
members = [
    "crates/app-core",
    "crates/app-io",
    "crates/app-sync",
    "crates/app-mcp",
    "crates/app-cli",
    "crates/app-gui",
    "crates/app-front",
    "crates/app-tui",
    "crates/app-testkit",
    "crates/app-tls",
    "crates/app-theme",
    "crates/app-mobile",
    "crates/app-host",
    "crates/app-android",
    "crates/app-ios",
    "xtask",
]
default-members = [
    "crates/app-core",
    "crates/app-io",
    "crates/app-sync",
    "crates/app-mcp",
    "crates/app-cli",
    "crates/app-gui",
    "crates/app-front",
    "crates/app-tui",
    "crates/app-testkit",
    "crates/app-tls",
    "crates/app-theme",
    "crates/app-mobile",
    "crates/app-host",
    "crates/app-android",
    "crates/app-ios",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95" # eframe/egui-winit 0.37 MSRV
license = "MIT OR Apache-2.0"
repository = "https://github.com/dariy/dail"

# Every member crate MUST contain `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
# Panics are banned in library code; tests are exempted via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
# Libraries log through `tracing`; binaries write output via `std::io::Write`.
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
# --- Internal crates ---
app-core = { path = "crates/app-core" }
app-io = { path = "crates/app-io" }
app-sync = { path = "crates/app-sync" }
app-mcp = { path = "crates/app-mcp" }
app-gui = { path = "crates/app-gui" }
app-front = { path = "crates/app-front" }
app-tui = { path = "crates/app-tui" }
app-testkit = { path = "crates/app-testkit" }
app-tls = { path = "crates/app-tls" }
app-theme = { path = "crates/app-theme" }
app-mobile = { path = "crates/app-mobile" }
app-host = { path = "crates/app-host" }
app-ios = { path = "crates/app-ios" }
app-android = { path = "crates/app-android" }

# --- Core: pure data crates only (allowed in app-core) ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.2", features = ["uuid1", "indexmap2"] } # JSON Schema -> MCP tool definitions (rmcp requires 1.x)
thiserror = "2.0"
indexmap = { version = "2.14", features = ["serde"] }
slotmap = { version = "1.1", features = ["serde"] }
# No RNG features here: app-core builds IDs from Ctx-provided values.
# Runtime crates opt into `v4` locally: `uuid = { workspace = true, features = ["v4"] }`.
uuid = { version = "1.28", features = ["serde"] }

# --- Mail formats & storage (app-io) ---
mail-parser = { version = "0.11", features = ["full_encoding"] } # full_encoding: CJK charsets via encoding_rs (pure Rust)
mail-builder = "1.0"
html2text = "0.17"
html5ever = "0.40" # HTML parser for the reader's documents (already in the tree via html2text and ammonia)
ammonia = "4.2" # HTML sanitizer for "open original" (shares html5ever with html2text)
# Full-text index over downloaded bodies (ADR 0005). No default features: they bring zstd, which compiles C.
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression"] }
toml = "1.1"
redb = "4.4"
sha2 = "0.11"
directories = "6.0"
# Mutexes that don't poison, so no crate needs its own lock-recovery helper (already in the tree via html5ever).
parking_lot = "0.12"

# --- TLS crypto (app-tls, ADR 0003) ---
zeroize = "1" # wipes keys on drop (already in the tree via rustls)
getrandom = "0.4" # the OS random source (already in the tree via uuid)

# --- Network runtime (app-sync) — rustls with app-tls (ADR 0003), never ring/aws-lc/openssl ---
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "signal"] }
# No built-in provider: app-tls is the provider (ADR 0003).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging"] }
webpki-roots = "1"
# Updates (ADR 0011): minisign signatures, verified in app-io, made by xtask. Pure Rust.
minisign-verify = "0.3"
minisign = { version = "0.10", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] } # Stream combinators for async-imap responses
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "pool", "tokio1-rustls", "rustls-no-provider", "webpki-roots"] } # TLS: app-tls, installed as the default provider
keyring = "4.2" # default `v1` store set: Secret Service via zbus (pure Rust), Windows Credential Manager
interprocess = { version = "2.4", features = ["tokio"] }

# --- Agent surfaces ---
rmcp = { version = "3.6", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
# `dail mcp --http` (ADR 0007): HTTP/1.1 on loopback for rmcp's Streamable HTTP service. Pure Rust.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
http-body-util = "0.1" # the 401 answer of `dail mcp --http` (already in the tree via rmcp)
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
rpassword = "7.5" # no-echo password prompt for `dail account add` (app-cli only)

# --- GUI (desktop-native; wasm deferred) ---
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit", "wayland", "x11", "system_fonts"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] } # the symbols the UI draws (✉, ⚠, …): default_fonts left them out in 0.37
nucleo-matcher = "0.3"
rfd = "0.17" # native file dialogs; default = XDG portal (no GTK)
# Inline (cid:) images in the reader; already in the tree via eframe (png). Pure-Rust decoders only.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
webbrowser = "1.2" # opens links and "open original" in the system browser (app-gui only)
# Desktop notifications (app-gui only): the freedesktop service over D-Bus on Linux (zbus is already in the tree for
# the keyring), toasts through WinRT on Windows (the `windows` crate is already in the tree for accesskit).
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications"] }

# --- Terminal UI (app-tui, ADR 0004) ---
# crossterm comes through `ratatui::crossterm` (0.29), so the two never drift.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
ratatui-textarea = { version = "0.9", default-features = false, features = ["crossterm"] }
unicode-width = "0.2" # column widths for wrapping (already in the tree via ratatui)

# --- Diagnostics ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Android host (ADR 0009): the JNI calls, and tracing to logcat (logd's socket, no liblog).
jni = "0.22"
tracing-logcat = "0.1"
# Android secrets (ADR 0009): keyring 4's Android store (Keystore-wrapped SharedPreferences) as keyring-core's
# default store; ndk-context hands it the VM and the application context. keyring's `v1` Entry refuses Android.
keyring-core = "1"
android-native-keyring-store = "1"
# iOS secrets (ADR 0010): keyring 4's Apple "protected data" store (the data-protection Keychain through
# security-framework, which links Security.framework and compiles no C). keyring's `v1` Entry refuses iOS too.
apple-native-keyring-store = { version = "1", features = ["protected"] }
ndk-context = "0.1"
anyhow = "1.0" # binaries (app-cli, xtask) only; libraries use thiserror

# --- Testing ---
insta = { version = "1.49", features = ["json"] }
egui_kittest = { version = "0.37", default-features = false } # headless GUI tests via the AccessKit tree
proptest = "1.12"
# Test oracles for app-tls (docs/plan-tls.md §7.2): pure Rust, dev-dependencies only, never linked into dail.
x25519-dalek = "3"
chacha20poly1305 = "0.11"
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa"] }

[profile.dev.package]
# Dependencies: opt-level 2 keeps egui and mail parsing responsive in debug builds. They keep only line tables
# (file:line in backtraces). With full debuginfo each test binary that links egui was ~0.5 GB (now ~0.2 GB) and a gate
# run left ~26 GB in target/ (now ~9 GB); optimized code has few locals to inspect.
"*" = { opt-level = 2, debug = "line-tables-only" }
# The TLS crypto runs at full speed in debug builds and tests (the Wycheproof and handshake tests would crawl at
# opt-level 0). It keeps full debuginfo: it is a workspace crate.
app-tls = { opt-level = 2 }
# Proc macros and the crates they use run only inside the compiler: at opt-level 0 they build in half the time and
# expand only a little slower. `[profile.dev.build-override]` can't do this, because `package."*"` takes precedence over
# it, so each crate is named here. The list covers ~85% of that build time; a crate missing from it only builds slower,
# and cargo warns about an entry that no longer matches a package.
# Left out on purpose: proc-macro2 and quote (cheap to build, used by every expansion), and wayland-scanner and
# phf_macros (they generate a lot of code during the build).
async-recursion = { opt-level = 0, debug = false }
async-trait = { opt-level = 0, debug = false }
bytemuck_derive = { opt-level = 0, debug = false }
cc = { opt-level = 0, debug = false }
clap_derive = { opt-level = 0, debug = false }
darling_core = { opt-level = 0, debug = false }
displaydoc = { opt-level = 0, debug = false }
futures-macro = { opt-level = 0, debug = false }
hashify = { opt-level = 0, debug = false }
pin-project-internal = { opt-level = 0, debug = false }
rmcp-macros = { opt-level = 0, debug = false }
schemars_derive = { opt-level = 0, debug = false }
serde_derive = { opt-level = 0, debug = false }
serde_derive_internals = { opt-level = 0, debug = false }
syn = { opt-level = 0, debug = false }
synstructure = { opt-level = 0, debug = false }
thiserror-impl = { opt-level = 0, debug = false }
tokio-macros = { opt-level = 0, debug = false }
tracing-attributes = { opt-level = 0, debug = false }
yoke-derive = { opt-level = 0, debug = false }
zbus_macros = { opt-level = 0, debug = false }
zerofrom-derive = { opt-level = 0, debug = false }
zerovec-derive = { opt-level = 0, debug = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
