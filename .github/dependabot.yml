# Update PRs (Wave 7 D1, ADR 0011): the SHA-pinned actions, the Cargo workspace and the Gradle project, each grouped
# into one PR for minor and patch updates (majors stay separate PRs). cargo-deny, Gradle's dependency verification
# and the licence allowlist review them like any other change; `dependabot-refresh.yml` refreshes the
# verification metadata and the licence lists, then dispatches CI on the new commit (D2, STORE-2).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle:
        update-types: [minor, patch]
