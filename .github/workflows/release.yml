# Builds the release packages on demand (Actions → release → Run workflow): a zip and an MSI with `dail.exe` on
# Windows, and a tar.gz, a .deb and an AppImage on Ubuntu, a signed APK per ABI for Android, and the unsigned IPAs (live and demo) for iOS, each with a .sha256. They run the same scripts as a local release build (scripts/) and
# are uploaded as the run's artifacts.
name: release

# A pushed `vX.Y.Z` tag builds and publishes a release (Wave 7, ADR 0011); by hand it is a dry run that builds
# everything and publishes nothing. Never on pull requests, so the signing secrets never run with their code.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only `publish` (tags, environment `release`) may write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The tag must name the version every version site holds (`cargo xtask release check-tag`); a dry run only checks
  # that the sites agree.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain || rustup toolchain install
      - if: startsWith(github.ref, 'refs/tags/')
        run: cargo xtask release check-tag "$GITHUB_REF_NAME"
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: cargo xtask release versions

  windows:
    needs: guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # rustup reads rust-toolchain.toml (channel + rustfmt + clippy) on the first cargo call.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: dotnet tool install --global wix --version 5.0.2
      - run: ./scripts/release-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dail-windows
          path: dist/*
          if-no-files-found: error

  ubuntu:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deb
      - run: ./scripts/release-ubuntu.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dail-ubuntu
          path: dist/*
          if-no-files-found: error

  android:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.1.0" > /dev/null
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-ndk
      # The signing key comes from repository secrets and lives only in the runner's temp directory.
      - name: Decode the signing key
        env:
          DAIL_ANDROID_KEYSTORE_BASE64: ${{ secrets.DAIL_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DAIL_ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::secret DAIL_ANDROID_KEYSTORE_BASE64 is not set; a release APK must be signed"
            exit 1
          fi
          echo "$DAIL_ANDROID_KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/dail-release.jks"
          echo "DAIL_SIGNING_STORE=$RUNNER_TEMP/dail-release.jks" >>"$GITHUB_ENV"
      - run: ./scripts/release-android.sh
        env:
          DAIL_SIGNING_STORE_PASSWORD: ${{ secrets.DAIL_ANDROID_STORE_PASSWORD }}
          DAIL_SIGNING_KEY_ALIAS: ${{ secrets.DAIL_ANDROID_KEY_ALIAS }}
          DAIL_SIGNING_KEY_PASSWORD: ${{ secrets.DAIL_ANDROID_KEY_PASSWORD }}
      - run: rm -f "$RUNNER_TEMP/dail-release.jks"
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dail-android
          path: dist/*
          if-no-files-found: error

  # The unsigned IPAs, live and demo, with their .sha256 (ADR 0010, plan §6): the user re-signs them with their own
  # Apple ID. No signing secret is involved.
  ios:
    needs: guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - run: brew install xcodegen
      - run: cargo xtask ios app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dail-ios
          path: dist/*
          if-no-files-found: error

  # Tags only (ADR 0011): the signed manifest over every artifact, then the GitHub Release. The only job with
  # `contents: write`, and the only one that sees the update signing key (environment `release`).
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, ubuntu, android, ios]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Sign the manifest
        env:
          DAIL_UPDATE_SIGNING_KEY: ${{ secrets.DAIL_UPDATE_SIGNING_KEY }}
          DAIL_UPDATE_SIGNING_PASSWORD: ${{ secrets.DAIL_UPDATE_SIGNING_PASSWORD }}
        run: |
          if [ -z "$DAIL_UPDATE_SIGNING_KEY" ]; then
            echo "::error::secret DAIL_UPDATE_SIGNING_KEY is not set; a release manifest must be signed"
            exit 1
          fi
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" cargo xtask release manifest --dist dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo xtask release notes >"$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "dail ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*
