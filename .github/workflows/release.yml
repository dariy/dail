# Builds the release packages on demand (Actions → release → Run workflow): a zip with `dail.exe` on Windows, and a
# tar.gz and a .deb on Ubuntu, and a signed APK per ABI for Android, each with a .sha256. They run the same scripts as a local release build (scripts/) and
# are uploaded as the run's artifacts.
name: release

# By hand only, so that the signing secrets never run with pull-request code (Wave 5 O).
on:
  workflow_dispatch:

# The jobs upload run artifacts and publish nothing, so the token stays read-only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # rustup reads rust-toolchain.toml (channel + rustfmt + clippy) on the first cargo call.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: ./scripts/release-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dail-windows
          path: dist/*
          if-no-files-found: error

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deb
      - run: ./scripts/release-ubuntu.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dail-ubuntu
          path: dist/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.1.0" > /dev/null
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-ndk
      # The signing key comes from repository secrets and lives only in the runner's temp directory.
      - name: Decode the signing key
        env:
          DAIL_ANDROID_KEYSTORE_BASE64: ${{ secrets.DAIL_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$DAIL_ANDROID_KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/dail-release.jks"
          echo "DAIL_SIGNING_STORE=$RUNNER_TEMP/dail-release.jks" >>"$GITHUB_ENV"
      - run: ./scripts/release-android.sh
        env:
          DAIL_SIGNING_STORE_PASSWORD: ${{ secrets.DAIL_ANDROID_STORE_PASSWORD }}
          DAIL_SIGNING_KEY_ALIAS: ${{ secrets.DAIL_ANDROID_KEY_ALIAS }}
          DAIL_SIGNING_KEY_PASSWORD: ${{ secrets.DAIL_ANDROID_KEY_PASSWORD }}
      - run: rm -f "$RUNNER_TEMP/dail-release.jks"
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dail-android
          path: dist/*
          if-no-files-found: error
