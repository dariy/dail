# Runs the Verification Loop (AGENTS.md §6) on every push and pull request, as parallel jobs that each run
# `cargo xtask verify <gates>`: fmt and deny once (neither depends on the OS; the deny graph covers every
# target), and clippy next to test + smoke on Ubuntu and Windows. clippy only builds metadata and test builds
# code, so one job running all three would share little more than build scripts.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Re-run by hand (the iOS job always runs then).
  workflow_dispatch:

# Read-only token for every job (Wave 5 O). Never add `pull_request_target`: fork code must not meet secrets.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A fresh checkout gains nothing from incremental caches; they only take disk and cache space.
  CARGO_INCREMENTAL: 0

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup reads rust-toolchain.toml (channel + rustfmt + clippy) on the first cargo call.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      - run: cargo xtask verify fmt deny

  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache, so a pull request cannot poison it for later runs.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask verify clippy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache, so a pull request cannot poison it for later runs.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask verify test smoke

  # The `android` gate (ADR 0009): clippy for the Android targets over the crates the app links, Gradle's
  # formatter, licences, Lint and JVM tests, then the APKs (cargo-ndk builds libdail.so) and their check.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache, so a pull request cannot poison it for later runs.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.1.0" > /dev/null
      - run: cargo xtask verify android

  # `cargo xtask android test` (ADR 0009): the Rust tests of app-core, app-io, app-tls and app-sync on an x86_64
  # emulator, where they meet bionic (redb, tantivy's mmap, getrandom, tokio, TLS).
  android-emulator:
    runs-on: ubuntu-latest
    steps:
      # The API 36 AVD's userdata partition needs ~7.4 GB, more than a runner has free after the SDK, the NDK and the
      # build. Drop preinstalled toolchains this job never uses (.NET, GHC, CodeQL, Boost, Swift).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add x86_64-linux-android
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-ndk
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache, so a pull request cannot poison it for later runs.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.1.0" > /dev/null
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: default
          disable-animations: true
          # The Rust tests on the device, then the instrumented tests (the debug bridge) over the demo build.
          script: |
            cargo xtask android test
            cd android && ./gradlew connectedDemoDebugAndroidTest -Pdail.abis=x86_64

  # Whether a push or pull request touches what the iOS app is built from, so the slow macOS job runs only then.
  # A `git diff` instead of a paths-filter action: no third-party code for a one-line question.
  ios-changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch or an unknown base has nothing to compare with: build.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qE '^(crates/|ios/|xtask/|Cargo\.|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  # The iOS app (ADR 0010): clippy for the iOS targets, both XCFrameworks, the Xcode project from
  # ios/project.yml (XcodeGen), both schemes built for the simulator, DailTests (the contract fixtures and
  # the demo host) on an iPad simulator, and the unsigned archives. Only a macOS runner has Xcode.
  ios:
    needs: ios-changes
    if: needs.ios-changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache, so a pull request cannot poison it for later runs.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: brew install xcodegen
      # The `ios` gate: `ios check`, `build`, `test` and `app` (the unsigned IPAs, built here to keep them building).
      - run: cargo xtask verify ios
      # redb and tantivy at 50k messages in the iPad simulator (a measurement with generous budgets; ROADMAP I3).
      - run: cargo xtask ios measure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: ios-tests.xcresult
          path: target/ios-tests.xcresult
          if-no-files-found: ignore
