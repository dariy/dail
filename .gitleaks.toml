# gitleaks configuration: the default rules, minus known test data (ROADMAP Wave 5 O, plan §1.1).
[extend]
useDefault = true

[allowlist]
description = "Public test vectors and throwaway test keys"
paths = [
  '''^crates/app-tls/testdata/wycheproof/''',
  '''^crates/app-tls/testdata/certs/server-(rsa|ecdsa)\.key$''',
]
# RFC 4231 HMAC-SHA256 test vectors in the hash tests.
regexes = [
  '''5bdcc146bf60754e6a042426089575c75a003f089d2739839dec58b964ec3843''',
  '''60e431591ee0b67f0d8a26aacbf5b77f8e0bc6213728c5140546040f0ee37f54''',
]
