# cargo-deny: `cargo deny check` (gate 5 of the Verification Loop)

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # C/C++ TLS & database bindings break the pure-Rust rule (ring is the sanctioned exception).
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "aws-lc-sys" },
    { name = "aws-lc-rs" },
    { name = "libsqlite3-sys" },
    { name = "cmake" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
