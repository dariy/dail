[package]
name = "app-android"
description = "dail's Android host, libdail.so: the session, the presenter and the calls Kotlin makes (ADR 0009)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "dail"
crate-type = ["cdylib", "rlib"]

# The workspace's lints with `unsafe_code = "deny"` instead of `forbid`, so that `src/jni.rs` alone may allow it
# (ADR 0009). `tests/it/lints.rs` pins this table to the workspace's.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"

[features]
# The memory backend over a built-in fixture (the `demo` flavour, as ADR 0001 allows for app-cli).
demo = ["dep:app-testkit"]

[dependencies]
app-core.workspace = true
app-io.workspace = true
app-mobile.workspace = true
app-sync.workspace = true
app-testkit = { workspace = true, optional = true }
jni.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store.workspace = true
keyring-core.workspace = true
ndk-context.workspace = true
tracing-logcat.workspace = true

[dev-dependencies]
app-testkit.workspace = true
toml.workspace = true
