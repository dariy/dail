[package]
name = "app-host"
description = "dail's mobile host without the platform: the session, the presenter and the six calls (ADR 0010)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
