[package]
name = "app-sync"
description = "dail runtime: Session, effect executor, IMAP/SMTP, keyring, IPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
app-core.workspace = true
app-io.workspace = true
app-tls.workspace = true
async-imap.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
interprocess.workspace = true
keyring.workspace = true
lettre.workspace = true
parking_lot.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
webpki-roots.workspace = true

# keyring's `v1` set turns on the Apple store's `keychain` feature, which does not build for iOS without
# `protected` (ADR 0010). Only this feature is wanted here; the iOS host uses the store itself.
# Desktop installs replace themselves with an update (ADR 0011); the phones only notify.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
self-replace.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
